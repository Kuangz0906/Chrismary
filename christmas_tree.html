<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Merry Christmas · Interactive Memory Tree</title>

  <!-- 字体与 Three.js / MediaPipe 均从 CDN 加载，断网时标题优雅降级为 serif。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
      }
    }
  </script>

  <style>
    :root {
      color-scheme: dark;
      --gold: #d4af37;
      --cream: #fceea7;
      --black: #000000;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
    }

    body {
      color: var(--cream);
      font-family: "Times New Roman", Times, serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button, input, label { font: inherit; }

    #scene, #scene-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #scene-canvas {
      display: block;
      touch-action: none;
      cursor: grab;
      outline: none;
    }

    #scene-canvas.is-dragging { cursor: grabbing; }

    /* 加载遮罩：黑底、40px 金圈与线性旋转。 */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 22px;
      background: #000;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    #loader.is-loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(212, 175, 55, 0.18);
      border-top: 1px solid var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.12);
    }

    .loader-title {
      margin: 0;
      color: var(--gold);
      font-family: "Cinzel", Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.34em;
      text-align: center;
    }

    #load-status {
      max-width: min(520px, 82vw);
      margin: -10px 0 0;
      color: rgba(252, 238, 167, 0.58);
      font-size: 12px;
      line-height: 1.7;
      letter-spacing: 0.08em;
      text-align: center;
    }

    #loader.has-error .spinner {
      animation-play-state: paused;
      border-color: rgba(212, 175, 55, 0.28);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* 所有界面元素统一受 H 键控制，隐藏时不拦截画布交互。 */
    .ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.45s ease, visibility 0s linear;
    }

    .ui.ui-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.45s ease, visibility 0s linear 0.45s;
    }

    .ui.ui-hidden * { pointer-events: none !important; }

    .title-wrap {
      position: absolute;
      top: 30px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin: 0;
      padding: 0 18px;
      color: transparent;
      background: linear-gradient(180deg, #ffffff 0%, #fceea7 46%, #d4af37 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: "Cinzel", Georgia, serif;
      font-size: 56px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0.035em;
      text-shadow: 0 0 18px rgba(252, 238, 167, 0.24), 0 0 46px rgba(212, 175, 55, 0.16);
      filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.16));
    }

    .subtitle {
      margin: 10px 0 0;
      color: rgba(252, 238, 167, 0.48);
      font-size: 10px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
    }

    .upload-wrapper {
      position: absolute;
      top: 38px;
      right: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .memory-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 25px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.72);
      border-radius: 999px;
      background: rgba(12, 12, 10, 0.34);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--cream);
      font-family: "Cinzel", Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      cursor: pointer;
      box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.04), 0 8px 30px rgba(0, 0, 0, 0.28);
      transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .memory-button::before {
      content: "+";
      margin-right: 10px;
      color: var(--gold);
      font-family: "Times New Roman", serif;
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
    }

    .memory-button:hover,
    .memory-button:focus-visible {
      border-color: var(--cream);
      background: rgba(212, 175, 55, 0.12);
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.16);
      transform: translateY(-1px);
      outline: none;
    }

    .upload-hint {
      margin: 0;
      color: rgba(252, 238, 167, 0.5);
      font-size: 10px;
      letter-spacing: 0.09em;
      white-space: nowrap;
    }

    #interaction-status {
      position: absolute;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      max-width: calc(100vw - 40px);
      margin: 0;
      padding: 8px 14px;
      border: 1px solid rgba(212, 175, 55, 0.14);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(252, 238, 167, 0.62);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-align: center;
      white-space: nowrap;
      transform: translateX(-50%);
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    #interaction-status.is-active {
      color: var(--cream);
      border-color: rgba(212, 175, 55, 0.38);
    }

    #toast {
      position: absolute;
      left: 50%;
      bottom: max(76px, calc(env(safe-area-inset-bottom) + 52px));
      max-width: calc(100vw - 40px);
      padding: 10px 18px;
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 999px;
      background: rgba(8, 8, 6, 0.76);
      color: var(--cream);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 摄像头与推理画布只用于 CV，不展示给用户。 */
    #webcam {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 160px;
      height: 120px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #webcam video,
    #webcam canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 160px;
      height: 120px;
      object-fit: cover;
    }

    noscript {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      place-content: center;
      padding: 30px;
      background: #000;
      color: var(--cream);
      text-align: center;
    }

    @media (max-width: 720px) {
      .title-wrap { top: 24px; }
      h1 { font-size: 36px; letter-spacing: 0.02em; }
      .subtitle { font-size: 8px; letter-spacing: 0.3em; }
      .upload-wrapper {
        top: 100px;
        right: 50%;
        transform: translateX(50%);
      }
      .memory-button { min-height: 40px; padding: 0 21px; font-size: 10px; }
      #interaction-status { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #loader, .ui, #toast { transition-duration: 0.01ms; }
    }
  </style>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>

  <div id="loader" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p class="loader-title">LOADING HOLIDAY MAGIC</p>
    <p id="load-status">正在准备 3D 场景与香槟金粒子…</p>
  </div>

  <div class="ui" id="ui">
    <header class="title-wrap">
      <h1>Merry Christmas</h1>
      <p class="subtitle">A season of memories</p>
    </header>

    <div class="upload-wrapper">
      <label class="memory-button" id="upload-button" for="memory-input" role="button" tabindex="0" aria-label="上传照片">
        ADD MEMORIES
      </label>
      <input id="memory-input" type="file" accept="image/*" multiple hidden>
      <p class="upload-hint">Press 'H' to Hide Controls</p>
    </div>

    <p id="interaction-status" aria-live="polite">Starting camera…</p>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <div id="webcam" aria-hidden="true">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="cv-canvas" width="160" height="120"></canvas>
  </div>

  <noscript>请启用 JavaScript，并联网后使用 Chrome / Edge 打开此文件。</noscript>

  <script type="module">
    // 全局状态机：TREE / SCATTER / FOCUS，所有位置变化均通过 lerp 连续过渡。
    const STATE = globalThis.STATE = {
      mode: 'TREE',
      gesture: 'NONE',
      handPos: { x: 0.5, y: 0.5 }
    };

    const BODY_COUNT = 1500;
    const DUST_COUNT = 2500;
    const CANDY_COUNT = 24;
    const MAX_PHOTOS = 30;
    const GESTURE_COOLDOWN = 400;
    const isMobile = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const pixelRatioLimit = isMobile ? 1.5 : 2;

    const loader = document.getElementById('loader');
    const loadStatus = document.getElementById('load-status');
    const ui = document.getElementById('ui');
    const statusElement = document.getElementById('interaction-status');
    const toastElement = document.getElementById('toast');
    const uploadButton = document.getElementById('upload-button');
    const memoryInput = document.getElementById('memory-input');
    const video = document.getElementById('video');
    const cvCanvas = document.getElementById('cv-canvas');
    const cvContext = cvCanvas.getContext('2d', { alpha: false });

    let THREE;
    let RoomEnvironment;
    let EffectComposer;
    let RenderPass;
    let UnrealBloomPass;
    let OutputPass;
    let scene, camera, renderer, composer, bloomPass, mainGroup;
    let particleField, dustField, photoWall;
    let environmentTarget;
    let handLandmarker = null;
    let cameraReady = false;
    let handControlActive = false;
    let focusedPhoto = null;
    let lastFocusedPhoto = null;
    let animationId = null;
    let running = false;
    let lastFrameTime = performance.now();
    let elapsed = 0;
    let lastInferenceAt = -Infinity;
    let lastVideoTime = -1;
    let lastHandSeen = 0;
    let candidateGesture = 'NONE';
    let candidateFrames = 0;
    let gestureLatch = 'NONE';
    let lastGestureAt = -Infinity;
    let cameraStatus = 'Starting camera…';
    let statusTimeout = 0;
    let toastTimeout = 0;
    let targetCameraZ = 50;
    let targetRotationX = 0;
    let targetRotationY = 0;
    let manualRotationUntil = 0;
    let hasManualRotation = false;

    // 通用提示与致命错误处理，避免 CDN 或 WebGL 失败产生未捕获异常。
    function showToast(message, duration = 2400) {
      clearTimeout(toastTimeout);
      toastElement.textContent = message;
      toastElement.classList.add('is-visible');
      toastTimeout = setTimeout(() => toastElement.classList.remove('is-visible'), duration);
    }

    function setStatus(message) {
      cameraStatus = message;
      clearTimeout(statusTimeout);
      statusElement.textContent = message;
      statusElement.classList.remove('is-active');
    }

    function announce(message, duration = 1500) {
      clearTimeout(statusTimeout);
      statusElement.textContent = message;
      statusElement.classList.add('is-active');
      statusTimeout = setTimeout(() => {
        statusElement.textContent = cameraStatus;
        statusElement.classList.remove('is-active');
      }, duration);
    }

    function showFatal(message) {
      running = false;
      if (animationId !== null) cancelAnimationFrame(animationId);
      animationId = null;
      loader.classList.remove('is-loaded');
      loader.classList.add('has-error');
      loader.querySelector('.loader-title').textContent = 'HOLIDAY MAGIC UNAVAILABLE';
      loadStatus.textContent = message;
    }

    window.addEventListener('error', (event) => {
      if (!event.message) return;
      event.preventDefault();
      if (!renderer) showFatal('场景初始化失败，请检查网络连接与浏览器 WebGL 支持。');
      else showToast('发生渲染错误，请刷新页面重试。');
    });

    window.addEventListener('unhandledrejection', (event) => {
      event.preventDefault();
      if (!renderer) showFatal('资源加载失败，请联网后刷新页面。');
      else showToast('资源加载失败，已保留当前场景。');
    });

    function randomShellVector(minRadius, maxRadius) {
      const direction = new THREE.Vector3(
        Math.random() - 0.5,
        Math.random() - 0.5,
        Math.random() - 0.5
      ).normalize();
      return direction.multiplyScalar(minRadius + Math.random() * (maxRadius - minRadius));
    }

    function dampAngle(current, target, factor) {
      const difference = Math.atan2(Math.sin(target - current), Math.cos(target - current));
      return current + difference * factor;
    }

    // 粒子类：保存树形、星云与聚焦光晕三套目标，并逐帧做阻尼插值。
    class Particle {
      constructor(kind, batch = null, instanceIndex = -1, parent = mainGroup) {
        this.kind = kind;
        this.batch = batch;
        this.instanceIndex = instanceIndex;
        this.parent = parent;
        this.mesh = null;
        this.position = new THREE.Vector3();
        this.desired = new THREE.Vector3();
        this.treePosition = new THREE.Vector3();
        this.scatterAnchor = randomShellVector(8, 20);
        this.scatterVelocity = new THREE.Vector3(
          (Math.random() - 0.5) * 0.8,
          (Math.random() - 0.5) * 0.8,
          (Math.random() - 0.5) * 0.8
        );
        this.spinAxis = new THREE.Vector3(
          Math.random() - 0.5,
          Math.random() - 0.5,
          Math.random() - 0.5
        ).normalize();
        this.focusAnchor = new THREE.Vector3(
          (Math.random() - 0.5) * 32,
          2 + (Math.random() - 0.5) * 22,
          -8 - Math.random() * 20
        );
        this.rotation = new THREE.Euler(
          Math.random() * Math.PI,
          Math.random() * Math.PI,
          Math.random() * Math.PI
        );
        this.spin = new THREE.Vector3(
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 1.2
        );
        this.phase = Math.random() * Math.PI * 2;
        this.spinSpeed = 0.08 + Math.random() * 0.16;
        this.treeT = Math.random();
        this.scaleValue = kind === 'BOX' ? 0.1 + Math.random() * 0.1 : 0.075 + Math.random() * 0.075;
        this.currentScale = this.scaleValue;
        this.buildTreePosition();
        this.position.copy(this.scatterAnchor);
      }

      buildTreePosition() {
        const t = this.treeT;
        const maxRadius = 9;
        const radius = maxRadius * (1 - t);
        const angle = t * 50 * Math.PI + this.phase;
        const jitter = 0.12 + (1 - t) * 0.2;
        this.treePosition.set(
          Math.cos(angle) * radius + (Math.random() - 0.5) * jitter,
          -12 + t * 26 + (Math.random() - 0.5) * jitter,
          Math.sin(angle) * radius + (Math.random() - 0.5) * jitter
        );
      }

      update(time, delta) {
        if (STATE.mode === 'TREE') {
          this.desired.copy(this.treePosition);
          this.desired.y += Math.sin(time * 0.7 + this.phase) * 0.045;
        } else if (STATE.mode === 'SCATTER') {
          this.desired.copy(this.scatterAnchor).applyAxisAngle(this.spinAxis, time * this.spinSpeed);
          this.desired.addScaledVector(this.scatterVelocity, Math.sin(time * 0.35 + this.phase));
          this.desired.clampLength(8, 20);
        } else {
          this.desired.copy(this.focusAnchor);
          this.parent.worldToLocal(this.desired);
        }

        this.position.lerp(this.desired, 0.075);
        const spinRate = STATE.mode === 'SCATTER' ? 1.8 : STATE.mode === 'FOCUS' ? 0.7 : 0.35;
        this.rotation.x += this.spin.x * delta * spinRate;
        this.rotation.y += this.spin.y * delta * spinRate;
        this.rotation.z += this.spin.z * delta * spinRate;
        const targetScale = this.scaleValue * (STATE.mode === 'FOCUS' ? 0.68 : 1);
        this.currentScale += (targetScale - this.currentScale) * 0.07;
      }

      writeMatrix(dummy) {
        dummy.position.copy(this.position);
        dummy.quaternion.setFromEuler(this.rotation);
        dummy.scale.setScalar(this.currentScale);
        dummy.updateMatrix();
        if (this.batch) this.batch.mesh.setMatrixAt(this.instanceIndex, dummy.matrix);
        else if (this.mesh) {
          this.mesh.position.copy(this.position);
          this.mesh.quaternion.copy(dummy.quaternion);
          this.mesh.scale.copy(dummy.scale);
        }
      }
    }

    // 糖果手杖继承粒子运动逻辑，使用程序化 Canvas 斜纹，不依赖外链图片。
    class CandyCane extends Particle {
      constructor(mesh, parent) {
        super('CANDY', null, -1, parent);
        this.mesh = mesh;
        this.treeT = 0.12 + Math.random() * 0.7;
        this.buildTreePosition();
        this.scaleValue = 0.34 + Math.random() * 0.16;
        this.currentScale = this.scaleValue;
      }
    }

    function createCandyTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const context = canvas.getContext('2d');
      context.fillStyle = '#fffaf0';
      context.fillRect(0, 0, 128, 128);
      context.strokeStyle = '#c9142b';
      context.lineWidth = 24;
      for (let offset = -128; offset < 256; offset += 48) {
        context.beginPath();
        context.moveTo(offset, 0);
        context.lineTo(offset + 128, 128);
        context.stroke();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(3, 2);
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return texture;
    }

    // InstancedMesh 将 1476 个方块/球体压缩为少量绘制调用，另有 24 根手杖。
    class ParticleField {
      constructor(parent) {
        this.parent = parent;
        this.particles = [];
        this.dummy = new THREE.Object3D();
        const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
        const sphereGeometry = new THREE.SphereGeometry(1, 10, 8);
        const goldBoxMaterial = new THREE.MeshStandardMaterial({
          color: 0xd4af37, metalness: 0.9, roughness: 0.15,
          emissive: 0x2a1c00, emissiveIntensity: 0.1
        });
        const greenBoxMaterial = new THREE.MeshStandardMaterial({
          color: 0x0b3b2e, metalness: 0.9, roughness: 0.15,
          emissive: 0x03150d, emissiveIntensity: 0.12
        });
        const goldSphereMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xd4af37, metalness: 0.9, roughness: 0.15,
          clearcoat: 0.55, clearcoatRoughness: 0.12
        });
        const redSphereMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xb5081b, metalness: 0.3, roughness: 0.18,
          clearcoat: 1, clearcoatRoughness: 0.1
        });

        this.batches = [
          this.createBatch(boxGeometry, goldBoxMaterial, 560),
          this.createBatch(boxGeometry, greenBoxMaterial, 360),
          this.createBatch(sphereGeometry, goldSphereMaterial, 300),
          this.createBatch(sphereGeometry, redSphereMaterial, 256)
        ];

        for (const batch of this.batches) {
          const kind = batch.mesh.geometry === boxGeometry ? 'BOX' : 'SPHERE';
          for (let index = 0; index < batch.count; index++) {
            this.particles.push(new Particle(kind, batch, index, parent));
          }
        }

        const caneCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-0.65, -1.6, 0),
          new THREE.Vector3(-0.65, -0.4, 0),
          new THREE.Vector3(-0.65, 0.9, 0),
          new THREE.Vector3(-0.58, 1.35, 0),
          new THREE.Vector3(-0.25, 1.55, 0),
          new THREE.Vector3(0.12, 1.45, 0),
          new THREE.Vector3(0.28, 1.16, 0),
          new THREE.Vector3(0.16, 0.9, 0),
          new THREE.Vector3(-0.04, 1.0, 0)
        ]);
        const caneGeometry = new THREE.TubeGeometry(caneCurve, 36, 0.13, 8, false);
        const caneMaterial = new THREE.MeshStandardMaterial({
          map: createCandyTexture(), metalness: 0.05, roughness: 0.3
        });
        for (let index = 0; index < CANDY_COUNT; index++) {
          const mesh = new THREE.Mesh(caneGeometry, caneMaterial);
          mesh.frustumCulled = false;
          parent.add(mesh);
          this.particles.push(new CandyCane(mesh, parent));
        }
      }

      createBatch(geometry, material, count) {
        const mesh = new THREE.InstancedMesh(geometry, material, count);
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mesh.frustumCulled = false;
        this.parent.add(mesh);
        return { mesh, count };
      }

      update(time, delta) {
        for (const particle of this.particles) {
          particle.update(time, delta);
          particle.writeMatrix(this.dummy);
        }
        for (const batch of this.batches) batch.mesh.instanceMatrix.needsUpdate = true;
      }
    }

    function createDustSprite() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 64;
      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.22, 'rgba(255,255,255,0.85)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 64, 64);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    // 2500 个低透明度尘埃点，独立慢速漂浮以提供景深。
    class DustField {
      constructor(parent) {
        this.positions = new Float32Array(DUST_COUNT * 3);
        this.velocities = new Float32Array(DUST_COUNT * 3);
        this.colors = new Float32Array(DUST_COUNT * 3);
        const palette = [new THREE.Color(0xd4af37), new THREE.Color(0xfceea7), new THREE.Color(0x6fa8ff)];
        for (let index = 0; index < DUST_COUNT; index++) {
          const offset = index * 3;
          this.positions[offset] = (Math.random() - 0.5) * 80;
          this.positions[offset + 1] = (Math.random() - 0.5) * 50;
          this.positions[offset + 2] = -60 + Math.random() * 70;
          this.velocities[offset] = (Math.random() - 0.5) * 0.05;
          this.velocities[offset + 1] = 0.015 + Math.random() * 0.055;
          this.velocities[offset + 2] = (Math.random() - 0.5) * 0.035;
          const color = palette[Math.floor(Math.random() * palette.length)];
          this.colors[offset] = color.r;
          this.colors[offset + 1] = color.g;
          this.colors[offset + 2] = color.b;
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(this.colors, 3));
        this.material = new THREE.PointsMaterial({
          size: 0.085,
          map: createDustSprite(),
          transparent: true,
          opacity: 0.3,
          alphaTest: 0.01,
          depthWrite: false,
          vertexColors: true,
          blending: THREE.AdditiveBlending,
          sizeAttenuation: true
        });
        this.points = new THREE.Points(geometry, this.material);
        this.points.frustumCulled = false;
        parent.add(this.points);
      }

      update(delta, time) {
        for (let index = 0; index < DUST_COUNT; index++) {
          const offset = index * 3;
          this.positions[offset] += this.velocities[offset] * delta;
          this.positions[offset + 1] += this.velocities[offset + 1] * delta;
          this.positions[offset + 2] += this.velocities[offset + 2] * delta;
          if (this.positions[offset + 1] > 25) this.positions[offset + 1] = -25;
          if (this.positions[offset] > 40) this.positions[offset] = -40;
          if (this.positions[offset] < -40) this.positions[offset] = 40;
          if (this.positions[offset + 2] > 10) this.positions[offset + 2] = -60;
          if (this.positions[offset + 2] < -60) this.positions[offset + 2] = 10;
        }
        this.points.geometry.attributes.position.needsUpdate = true;
        this.points.rotation.y = Math.sin(time * 0.035) * 0.06;
        const targetOpacity = STATE.mode === 'SCATTER' ? 0.42 : 0.3;
        this.material.opacity += (targetOpacity - this.material.opacity) * 0.035;
      }
    }

    let photoGeometry, frameGeometry, frameMaterial;

    function createPhotoAssets() {
      photoGeometry = new THREE.PlaneGeometry(1, 1);
      frameGeometry = new THREE.BoxGeometry(1, 1, 1);
      frameMaterial = new THREE.MeshStandardMaterial({
        color: 0xd4af37, metalness: 0.92, roughness: 0.18,
        emissive: 0x241700, emissiveIntensity: 0.08
      });
    }

    // 每张照片由独立贴图平面与金色 BoxGeometry 相框组成，并始终 billboard 朝向相机。
    class Photo {
      constructor(texture, index, isDefault) {
        this.type = 'PHOTO';
        this.texture = texture;
        this.isDefault = isDefault;
        this.index = index;
        this.group = new THREE.Group();
        this.group.userData.type = 'PHOTO';
        this.frame = new THREE.Mesh(frameGeometry, frameMaterial);
        this.surface = new THREE.Mesh(photoGeometry, new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide
        }));
        this.frame.userData.photo = this;
        this.surface.userData.photo = this;
        this.group.add(this.frame, this.surface);

        const image = texture.image;
        const sourceWidth = image?.videoWidth || image?.width || 640;
        const sourceHeight = image?.videoHeight || image?.height || 480;
        const aspect = sourceWidth / Math.max(1, sourceHeight);
        const width = aspect >= 1 ? 2.4 : 1.8 * aspect;
        const height = aspect >= 1 ? 2.4 / aspect : 1.8;
        this.frame.scale.set(width + 0.18, height + 0.18, 0.12);
        this.surface.scale.set(width, height, 1);
        this.surface.position.z = 0.062;

        const t = 0.25 + ((index * 0.381966) % 1) * 0.5;
        const angle = index * 2.399963 + 0.4;
        const radius = 9 * (1 - t) * 0.82;
        this.treePosition = new THREE.Vector3(
          Math.cos(angle) * radius,
          -12 + t * 26,
          Math.sin(angle) * radius
        );
        this.scatterAnchor = randomShellVector(11, 18);
        this.focusAnchor = new THREE.Vector3(
          (Math.random() - 0.5) * 30,
          2 + (Math.random() - 0.5) * 20,
          -6 - Math.random() * 20
        );
        this.spinAxis = new THREE.Vector3(
          Math.random() - 0.5,
          Math.random() - 0.5,
          Math.random() - 0.5
        ).normalize();
        this.phase = Math.random() * Math.PI * 2;
        this.tiltQuaternion = new THREE.Quaternion().setFromEuler(new THREE.Euler(
          (Math.random() - 0.5) * 0.14,
          (Math.random() - 0.5) * 0.14,
          (Math.random() - 0.5) * 0.1
        ));
        this.currentScale = 0.02;
        this.group.scale.setScalar(this.currentScale);
        this.group.position.set((Math.random() - 0.5) * 0.8, 15.2 + Math.random() * 0.6, 0);
        mainGroup.add(this.group);
      }

      update(time, temporary, parentQuaternion, cameraQuaternion, targetQuaternion) {
        if (STATE.mode === 'TREE') {
          temporary.copy(this.treePosition);
          temporary.y += Math.sin(time * 0.65 + this.phase) * 0.13;
          temporary.x += Math.sin(time * 0.32 + this.phase) * 0.05;
        } else if (STATE.mode === 'SCATTER') {
          temporary.copy(this.scatterAnchor).applyAxisAngle(this.spinAxis, time * 0.055);
          temporary.y += Math.sin(time * 0.45 + this.phase) * 0.3;
        } else if (this === focusedPhoto) {
          temporary.set(0, 2, 35);
          mainGroup.worldToLocal(temporary);
        } else {
          temporary.copy(this.focusAnchor);
          mainGroup.worldToLocal(temporary);
        }

        this.group.position.lerp(temporary, this === focusedPhoto ? 0.065 : 0.05);
        const targetScale = this === focusedPhoto ? 4.5 : STATE.mode === 'FOCUS' ? 0.68 : 1;
        this.currentScale += (targetScale - this.currentScale) * 0.065;
        this.group.scale.setScalar(this.currentScale);

        mainGroup.getWorldQuaternion(parentQuaternion).invert();
        camera.getWorldQuaternion(cameraQuaternion);
        targetQuaternion.copy(parentQuaternion).multiply(cameraQuaternion);
        if (this !== focusedPhoto) targetQuaternion.multiply(this.tiltQuaternion);
        this.group.quaternion.copy(targetQuaternion);
      }

      dispose() {
        mainGroup.remove(this.group);
        this.surface.material.dispose();
        this.texture.dispose();
      }
    }

    // 照片墙负责任命制、30 张上限、随机聚焦与下一张切换。
    class PhotoWall {
      constructor() {
        this.photos = [];
        this.serial = 0;
        this.temporary = new THREE.Vector3();
        this.parentQuaternion = new THREE.Quaternion();
        this.cameraQuaternion = new THREE.Quaternion();
        this.targetQuaternion = new THREE.Quaternion();
      }

      add(texture, isDefault = false) {
        while (this.photos.length >= MAX_PHOTOS) {
          const removable = this.photos.find((photo) => !photo.isDefault) || this.photos[0];
          this.remove(removable);
        }
        const photo = new Photo(texture, this.serial++, isDefault);
        this.photos.push(photo);
        return photo;
      }

      remove(photo) {
        const index = this.photos.indexOf(photo);
        if (index === -1) return;
        this.photos.splice(index, 1);
        if (focusedPhoto === photo) {
          focusedPhoto = null;
          if (STATE.mode === 'FOCUS') this.choose(true);
        }
        photo.dispose();
      }

      choose(randomize = true, preferred = null) {
        if (!this.photos.length) return null;
        let next = preferred;
        if (!next) {
          const pool = this.photos.filter((photo) => photo !== focusedPhoto && photo !== lastFocusedPhoto);
          const candidates = pool.length ? pool : this.photos;
          next = randomize
            ? candidates[Math.floor(Math.random() * candidates.length)]
            : candidates[0];
        }
        lastFocusedPhoto = focusedPhoto;
        focusedPhoto = next;
        return next;
      }

      cycle() {
        if (!this.photos.length) return;
        const currentIndex = this.photos.indexOf(focusedPhoto);
        const next = this.photos[(currentIndex + 1) % this.photos.length];
        this.choose(false, next);
      }

      update(time) {
        for (const photo of this.photos) {
          photo.update(
            time,
            this.temporary,
            this.parentQuaternion,
            this.cameraQuaternion,
            this.targetQuaternion
          );
        }
      }
    }

    function createDefaultPhotoTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 768;
      canvas.height = 512;
      const context = canvas.getContext('2d');
      const gradient = context.createLinearGradient(0, 0, 768, 512);
      gradient.addColorStop(0, '#07150f');
      gradient.addColorStop(0.55, '#10241a');
      gradient.addColorStop(1, '#030705');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 768, 512);
      context.strokeStyle = '#d4af37';
      context.lineWidth = 3;
      context.strokeRect(28, 28, 712, 456);
      context.strokeStyle = 'rgba(212,175,55,0.35)';
      context.lineWidth = 1;
      context.strokeRect(40, 40, 688, 432);
      context.fillStyle = '#fceea7';
      context.textAlign = 'center';
      context.font = '500 64px Cinzel, Georgia, serif';
      context.fillText('JOYEUX NOEL', 384, 274);
      context.fillStyle = 'rgba(212,175,55,0.8)';
      context.font = '18px Cinzel, Georgia, serif';
      context.fillText('A SEASON OF MEMORIES', 384, 322);
      context.beginPath();
      context.moveTo(384, 84);
      context.lineTo(394, 112);
      context.lineTo(424, 114);
      context.lineTo(401, 134);
      context.lineTo(409, 163);
      context.lineTo(384, 146);
      context.lineTo(359, 163);
      context.lineTo(367, 134);
      context.lineTo(344, 114);
      context.lineTo(374, 112);
      context.closePath();
      context.fillStyle = '#d4af37';
      context.fill();
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return texture;
    }

    // 场景初始化：渲染器、豪宅环境反射、冷暖灯光与 Bloom 后期管线。
    async function loadEngineModules() {
      const [threeModule, roomModule, composerModule, renderModule, bloomModule, outputModule] = await Promise.all([
        import('three'),
        import('three/addons/environments/RoomEnvironment.js'),
        import('three/addons/postprocessing/EffectComposer.js'),
        import('three/addons/postprocessing/RenderPass.js'),
        import('three/addons/postprocessing/UnrealBloomPass.js'),
        import('three/addons/postprocessing/OutputPass.js')
      ]);
      THREE = threeModule;
      RoomEnvironment = roomModule.RoomEnvironment;
      EffectComposer = composerModule.EffectComposer;
      RenderPass = renderModule.RenderPass;
      UnrealBloomPass = bloomModule.UnrealBloomPass;
      OutputPass = outputModule.OutputPass;
    }

    function setupScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.FogExp2(0x000000, 0.0065);

      camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
      camera.position.set(0, 2, 50);
      camera.lookAt(0, 2, 0);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, pixelRatioLimit));
      renderer.setSize(innerWidth, innerHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ReinhardToneMapping;
      renderer.toneMappingExposure = 2.2;
      renderer.setClearColor(0x000000, 1);
      renderer.domElement.id = 'scene-canvas';
      renderer.domElement.setAttribute('aria-label', '交互式 3D 圣诞树');
      document.getElementById('scene').appendChild(renderer.domElement);

      const pmrem = new THREE.PMREMGenerator(renderer);
      const room = new RoomEnvironment();
      environmentTarget = pmrem.fromScene(room, 0.04);
      scene.environment = environmentTarget.texture;
      room.dispose?.();
      pmrem.dispose();

      mainGroup = new THREE.Group();
      mainGroup.rotation.y = 0.12;
      scene.add(mainGroup);

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const innerLight = new THREE.PointLight(0xff8c42, 2, 22, 2);
      innerLight.position.set(0, -1, 0);
      mainGroup.add(innerLight);

      const warmSpot = new THREE.SpotLight(0xffd27f, 1200, 160, 0.48, 0.65, 2);
      warmSpot.position.set(30, 40, 40);
      warmSpot.target.position.set(0, 0, 0);
      scene.add(warmSpot, warmSpot.target);
      const coolSpot = new THREE.SpotLight(0x6fa8ff, 600, 160, 0.5, 0.7, 2);
      coolSpot.position.set(-30, 20, -30);
      coolSpot.target.position.set(0, 0, 0);
      scene.add(coolSpot, coolSpot.target);

      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.4, 0.7);
      composer.addPass(bloomPass);
      composer.addPass(new OutputPass());

      particleField = new ParticleField(mainGroup);
      dustField = new DustField(scene);
      createPhotoAssets();
      photoWall = new PhotoWall();
      photoWall.add(createDefaultPhotoTexture(), true);
      raycaster = new THREE.Raycaster();
      pointerNdc = new THREE.Vector2();

      renderer.domElement.addEventListener('webglcontextlost', (event) => {
        event.preventDefault();
        stopLoop();
        showFatal('WebGL 上下文已丢失，请刷新页面重新打开圣诞树。');
      });
    }

    // 统一尺寸处理；移动端降低 DPR，并进一步缩小 Bloom 中间渲染目标。
    function resize() {
      if (!renderer || !composer || !camera || !bloomPass) return;
      const width = Math.max(1, innerWidth);
      const height = Math.max(1, innerHeight);
      const ratio = Math.min(devicePixelRatio || 1, pixelRatioLimit);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(ratio);
      renderer.setSize(width, height, false);
      composer.setPixelRatio(ratio);
      composer.setSize(width, height);
      const bloomScale = isMobile ? 0.5 : 1;
      const bloomWidth = Math.max(1, Math.round(width * ratio * bloomScale));
      const bloomHeight = Math.max(1, Math.round(height * ratio * bloomScale));
      bloomPass.resolution.set(bloomWidth, bloomHeight);
      bloomPass.setSize(bloomWidth, bloomHeight);
    }

    function addPhotoToScene(texture) {
      photoWall.add(texture, false);
      showToast(`Memory added · ${photoWall.photos.length}/${MAX_PHOTOS}`);
    }

    // 上传核心保持 FileReader -> DataURL -> TextureLoader -> addPhotoToScene。
    function readMemoryFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        new THREE.TextureLoader().load(ev.target.result, (t) => {
          t.colorSpace = THREE.SRGBColorSpace;   // 关键：指定色彩空间，否则照片发灰
          t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
          addPhotoToScene(t);
        }, undefined, () => showToast('这张照片无法读取，请尝试 JPG 或 PNG。'));
      };
      reader.onerror = () => showToast('照片读取失败，请重试。');
      reader.readAsDataURL(file);
    }

    function enterFocus(preferred = null, randomize = true) {
      if (!photoWall?.photos.length) return;
      STATE.mode = 'FOCUS';
      photoWall.choose(randomize, preferred);
      targetCameraZ = 50;
      announce('FOCUS · pinch or tap for next · Esc to return');
    }

    function setMode(mode) {
      if (mode === 'FOCUS') {
        enterFocus();
        return;
      }
      STATE.mode = mode;
      focusedPhoto = null;
      if (mode === 'TREE') announce('TREE · memories gathered');
      else if (mode === 'SCATTER') announce('SCATTER · a constellation of memories');
    }

    function applyGesture(gesture) {
      if (gesture === 'PINCH') {
        if (STATE.mode === 'FOCUS') {
          photoWall.cycle();
          announce('PINCH · next memory');
        } else {
          enterFocus();
          announce('PINCH · memory focused · pinch again for next');
        }
      } else if (gesture === 'FIST') {
        setMode('TREE');
      } else if (gesture === 'OPEN') {
        setMode('SCATTER');
      }
    }

    // MediaPipe：GPU HandLandmarker、30fps 抽帧、两帧确认与 400ms 冷却。
    async function initHandTracking() {
      try {
        const { FilesetResolver, HandLandmarker } = await import('@mediapipe/tasks-vision');
        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
        );
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera API unavailable');
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
        await video.play();
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numHands: 1,
          minHandDetectionConfidence: 0.5,
          minHandPresenceConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        cameraReady = true;
        lastVideoTime = -1;
        lastInferenceAt = -Infinity;
        stream.getVideoTracks().forEach((track) => {
          track.addEventListener('ended', () => fallbackCamera('摄像头视频流已结束'), { once: true });
        });
        delete statusElement.dataset.reason;
        statusElement.removeAttribute('title');
        setStatus('Camera on · pinch / open / fist · palm-span zoom');
      } catch (error) {
        let reason = error?.message || 'MediaPipe 模型、WASM 或 GPU 初始化失败';
        if (error?.name === 'NotAllowedError' || error?.name === 'SecurityError') reason = '摄像头权限被拒绝或当前文件环境不允许访问';
        else if (error?.name === 'NotFoundError') reason = '没有找到可用摄像头';
        else if (error?.name === 'NotReadableError') reason = '摄像头被其他程序占用或无法读取';
        else if (error?.name === 'AbortError') reason = '摄像头启动被中断';
        fallbackCamera(reason);
      }
    }

    function fallbackCamera(reason = '') {
      cameraReady = false;
      handControlActive = false;
      handLandmarker?.close?.();
      handLandmarker = null;
      const stream = video.srcObject;
      if (stream) stream.getTracks().forEach((track) => track.stop());
      video.srcObject = null;
      STATE.gesture = 'NONE';
      candidateGesture = 'NONE';
      candidateFrames = 0;
      gestureLatch = 'NONE';
      setStatus('Camera off · drag to rotate');
      statusElement.title = reason;
      statusElement.dataset.reason = reason;
    }

    function processHand(landmarks, now) {
      if (!landmarks || landmarks.length < 21) {
        if (now - lastHandSeen > 450) {
          handControlActive = false;
          STATE.gesture = 'NONE';
          candidateGesture = 'NONE';
          candidateFrames = 0;
          gestureLatch = 'NONE';
        }
        return;
      }

      handControlActive = true;
      lastHandSeen = now;
      // 摄像头画面相当于镜像，因此 x 取反，手掌移动方向才与用户一致。
      STATE.handPos.x = 1 - landmarks[9].x;
      STATE.handPos.y = landmarks[9].y;

      const pinchDistance = Math.hypot(
        landmarks[4].x - landmarks[8].x,
        landmarks[4].y - landmarks[8].y
      );
      // 握拳/张手只计算食指、中指、无名指、小指四指，拇指距离单独用于捏合。
      const fingertips = [8, 12, 16, 20];
      const wrist = landmarks[0];
      const averageDistance = fingertips.reduce((sum, tipIndex) => {
        const tip = landmarks[tipIndex];
        return sum + Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
      }, 0) / fingertips.length;
      const palmSpan = Math.hypot(landmarks[12].x - wrist.x, landmarks[12].y - wrist.y);

      let gesture = 'NONE';
      // 捏合必须优先判断，否则其余手指弯曲时会被四指平均距离误判为握拳。
      if (pinchDistance < 0.05) gesture = 'PINCH';
      else if (averageDistance < 0.25) gesture = 'FIST';
      else if (averageDistance > 0.4) gesture = 'OPEN';

      // 单手机掌跨度映射为相机距离：拳头推远、张开拉近，聚焦照片时保持稳定构图。
      if (STATE.mode !== 'FOCUS' && gesture !== 'PINCH') {
        const zoomAmount = THREE.MathUtils.clamp((palmSpan - 0.22) / 0.28, 0, 1);
        const gestureCameraZ = 65 - zoomAmount * 27;
        targetCameraZ += (gestureCameraZ - targetCameraZ) * 0.18;
      }

      if (gesture === candidateGesture) candidateFrames++;
      else {
        candidateGesture = gesture;
        candidateFrames = 1;
      }
      STATE.gesture = candidateFrames >= 2 ? gesture : 'NONE';
      if (gesture === 'NONE') {
        gestureLatch = 'NONE';
        return;
      }
      if (candidateFrames >= 2 && gesture !== gestureLatch && now - lastGestureAt >= GESTURE_COOLDOWN) {
        gestureLatch = gesture;
        lastGestureAt = now;
        applyGesture(gesture);
      }
    }

    function runInference(now) {
      if (!handLandmarker || !cameraReady || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
      if (now - lastInferenceAt < 1000 / 30 || video.currentTime === lastVideoTime) return;
      lastInferenceAt = now;
      lastVideoTime = video.currentTime;
      cvContext.save();
      cvContext.translate(cvCanvas.width, 0);
      cvContext.scale(-1, 1);
      cvContext.drawImage(video, 0, 0, cvCanvas.width, cvCanvas.height);
      cvContext.restore();
      try {
        const result = handLandmarker.detectForVideo(video, now);
        processHand(result.landmarks?.[0] ?? null, now);
      } catch (error) {
        fallbackCamera(error?.message || '手势推理意外中断');
      }
    }

    // 鼠标 / 触摸拖拽、滚轮 / 双指缩放，以及无摄像头时的照片点击交互。
    let raycaster = null;
    let pointerNdc = null;
    const activePointers = new Map();
    let dragStart = null;
    let lastPointer = null;
    let pinchStartDistance = 0;
    let pinchStartCameraZ = 50;
    let pointerMoved = false;

    function pointerDistance() {
      const points = [...activePointers.values()];
      if (points.length < 2) return 0;
      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    function focusFromPointer(event) {
      if (!photoWall?.photos.length || !camera) return;
      const bounds = renderer.domElement.getBoundingClientRect();
      pointerNdc.set(
        ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
        -((event.clientY - bounds.top) / bounds.height) * 2 + 1
      );
      raycaster.setFromCamera(pointerNdc, camera);
      const surfaces = photoWall.photos.map((photo) => photo.surface);
      const hit = raycaster.intersectObjects(surfaces, false)[0];
      if (hit) {
        const photo = hit.object.userData.photo;
        if (STATE.mode === 'FOCUS' && photo === focusedPhoto) photoWall.cycle();
        else enterFocus(photo, false);
        announce('FOCUS · tap for next · Esc to return');
      } else if (STATE.mode === 'FOCUS') {
        photoWall.cycle();
        announce('FOCUS · next memory');
      }
    }

    function bindInteractions() {
      const canvas = renderer.domElement;
      canvas.addEventListener('pointerdown', (event) => {
        canvas.setPointerCapture(event.pointerId);
        activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        pointerMoved = false;
        dragStart = { x: event.clientX, y: event.clientY, time: performance.now() };
        lastPointer = { x: event.clientX, y: event.clientY };
        targetRotationX = mainGroup.rotation.x;
        targetRotationY = mainGroup.rotation.y;
        if (activePointers.size === 2) {
          pinchStartDistance = pointerDistance();
          pinchStartCameraZ = targetCameraZ;
          pointerMoved = true;
        }
        canvas.classList.add('is-dragging');
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!activePointers.has(event.pointerId)) return;
        activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (activePointers.size >= 2) {
          const distance = pointerDistance();
          if (pinchStartDistance > 0 && STATE.mode !== 'FOCUS') {
            targetCameraZ = THREE.MathUtils.clamp(
              pinchStartCameraZ * (pinchStartDistance / Math.max(1, distance)),
              38, 65
            );
          }
          pointerMoved = true;
          return;
        }
        if (!lastPointer) return;
        const deltaX = event.clientX - lastPointer.x;
        const deltaY = event.clientY - lastPointer.y;
        if (Math.abs(deltaX) + Math.abs(deltaY) > 1) pointerMoved = true;
        targetRotationY += deltaX * 0.005;
        targetRotationX = THREE.MathUtils.clamp(targetRotationX + deltaY * 0.003, -0.38, 0.38);
        lastPointer = { x: event.clientX, y: event.clientY };
        hasManualRotation = true;
        manualRotationUntil = performance.now() + 2500;
      });

      const finishPointer = (event) => {
        const wasActive = activePointers.has(event.pointerId);
        activePointers.delete(event.pointerId);
        if (!wasActive) return;
        if (!activePointers.size) {
          canvas.classList.remove('is-dragging');
          const isTap = !pointerMoved && dragStart &&
            Math.hypot(event.clientX - dragStart.x, event.clientY - dragStart.y) < 6 &&
            performance.now() - dragStart.time < 350;
          if (isTap) focusFromPointer(event);
          lastPointer = null;
          dragStart = null;
          pinchStartDistance = 0;
        } else {
          lastPointer = [...activePointers.values()][0];
        }
      };
      canvas.addEventListener('pointerup', finishPointer);
      canvas.addEventListener('pointercancel', finishPointer);

      canvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        if (STATE.mode === 'FOCUS') return;
        targetCameraZ = THREE.MathUtils.clamp(targetCameraZ + event.deltaY * 0.02, 38, 65);
      }, { passive: false });

      uploadButton.addEventListener('click', () => memoryInput.click());
      uploadButton.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          memoryInput.click();
        }
      });
      memoryInput.addEventListener('change', () => {
        const files = [...(memoryInput.files || [])];
        files.forEach(readMemoryFile);
        memoryInput.value = '';
      });

      window.addEventListener('keydown', (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key.toLowerCase() === 'h') {
          ui.classList.toggle('ui-hidden');
          ui.setAttribute('aria-hidden', ui.classList.contains('ui-hidden') ? 'true' : 'false');
        } else if (event.key === 'Escape' && STATE.mode === 'FOCUS') {
          setMode('TREE');
        }
      });

      window.addEventListener('resize', resize, { passive: true });
    }

    // 主动画循环：推理 -> 旋转 -> 粒子/照片 lerp -> Bloom 强度渐变 -> 合成渲染。
    function animate(now) {
      animationId = null;
      if (!running || document.hidden) return;
      try {
        const delta = Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
        lastFrameTime = now;
        elapsed += delta;
        runInference(now);

        if (handControlActive) {
          const handTargetY = (STATE.handPos.x - 0.5) * 0.6;
          const handTargetX = (STATE.handPos.y - 0.5) * 0.3;
          mainGroup.rotation.y = dampAngle(mainGroup.rotation.y, handTargetY, 0.08);
          mainGroup.rotation.x += (handTargetX - mainGroup.rotation.x) * 0.08;
        } else if (hasManualRotation && now < manualRotationUntil) {
          mainGroup.rotation.y = dampAngle(mainGroup.rotation.y, targetRotationY, 0.08);
          mainGroup.rotation.x += (targetRotationX - mainGroup.rotation.x) * 0.08;
        } else if (STATE.mode === 'TREE') {
          mainGroup.rotation.y += 0.002;
          mainGroup.rotation.x += (0 - mainGroup.rotation.x) * 0.025;
        } else if (STATE.mode === 'SCATTER') {
          mainGroup.rotation.y += 0.0008;
          mainGroup.rotation.x += (0 - mainGroup.rotation.x) * 0.02;
        }
        if (Math.abs(mainGroup.rotation.y) > Math.PI * 2) mainGroup.rotation.y %= Math.PI * 2;

        camera.position.z += (targetCameraZ - camera.position.z) * 0.08;
        camera.lookAt(0, 2, 0);
        mainGroup.updateMatrixWorld(true);
        particleField.update(elapsed, delta);
        photoWall.update(elapsed);
        dustField.update(delta, elapsed);

        const targetBloom = STATE.mode === 'SCATTER' ? 0.62 : STATE.mode === 'FOCUS' ? 0.38 : 0.45;
        bloomPass.strength += (targetBloom - bloomPass.strength) * 0.04;
        composer.render();
        animationId = requestAnimationFrame(animate);
      } catch {
        stopLoop();
        fallbackCamera();
        showFatal('渲染意外中断，请刷新页面重试。');
      }
    }

    function startLoop() {
      if (running && !document.hidden && animationId === null) {
        lastFrameTime = performance.now();
        lastInferenceAt = -Infinity;
        animationId = requestAnimationFrame(animate);
      }
    }

    function stopLoop() {
      if (animationId !== null) cancelAnimationFrame(animationId);
      animationId = null;
    }

    // 页面隐藏时同时暂停渲染与 CV 推理，恢复后从新的时间戳继续。
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopLoop();
      else startLoop();
    });

    window.addEventListener('pagehide', () => {
      stopLoop();
      fallbackCamera();
    });

    async function init() {
      try {
        await loadEngineModules();
        setupScene();
        resize();
        bindInteractions();
        mainGroup.updateMatrixWorld(true);
        particleField.update(0, 0);
        photoWall.update(0);
        dustField.update(0, 0);
        composer.render();
        running = true;
        loader.classList.add('is-loaded');
        startLoop();
        void initHandTracking();
      } catch {
        showFatal('无法载入 3D 引擎，请确认网络可访问 jsDelivr，并使用支持 WebGL 的 Chrome / Edge。');
      }
    }

    init();
  </script>

  <!-- 使用说明：1. 将本文件以 UTF-8 保存为 christmas_tree.html，联网后双击用 Chrome / Edge 打开。
  2. 首次打开允许摄像头；拒绝或无摄像头时自动使用拖拽旋转、滚轮缩放。
  3. 按 H 隐藏/显示全部 UI，获得纯净画面。
  4. 点击 ADD MEMORIES 选择照片，新照片从树顶飘落；最多保留 30 张，超出时替换最早上传的照片。
  5. 捏合进入照片聚焦，再次捏合切换下一张；无摄像头时点击照片聚焦、点击画面切换，Esc 返回树形。 -->
</body>
</html>
